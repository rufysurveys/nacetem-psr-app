<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" role="img" aria-label="Guile Sonic Commando Avatar">
  <defs>
    <linearGradient id="guile-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <radialGradient id="guile-sonic" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#15803d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="guile-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="flattop-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="200" height="200" rx="40" fill="url(#guile-bg)"/>
  
  <!-- Sonic Boom Wave Circles -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.3"/>
  <circle cx="100" cy="100" r="65" fill="none" stroke="#86efac" stroke-width="2" opacity="0.4"/>
  <circle cx="100" cy="100" r="75" fill="url(#guile-sonic)"/>

  <!-- Character Group -->
  <g transform="translate(0, 5)">
    <!-- Camo Tank Top & Muscular Torso -->
    <path d="M32 195 C 38 140, 58 128, 100 128 C 142 128, 162 140, 168 195 Z" fill="#14532d"/>
    <path d="M68 135 L100 165 L132 135" fill="none" stroke="#15803d" stroke-width="8"/>
    <path d="M80 138 L100 178 L120 138" fill="url(#guile-skin)"/>
    <!-- Dog Tags -->
    <ellipse cx="100" cy="168" rx="5" ry="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M92 138 Q100 160 108 138" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Muscular Neck -->
    <path d="M78 105 L78 136 C 78 146, 122 146, 122 105 Z" fill="#ea580c"/>

    <!-- Head & Chiseled Jaw -->
    <path d="M70 65 C 70 48, 130 48, 130 65 C 130 102, 122 118, 100 118 C 78 118, 70 102, 70 65 Z" fill="url(#guile-skin)"/>

    <!-- Ears -->
    <ellipse cx="66" cy="78" rx="6" ry="10" fill="#f97316"/>
    <ellipse cx="134" cy="78" rx="6" ry="10" fill="#f97316"/>

    <!-- Tactical Sunglasses / Stern Eyes -->
    <path d="M70 68 L100 70 L130 68 L126 84 L100 86 L74 84 Z" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <path d="M74 72 L96 73 L94 80 L76 79 Z" fill="#334155"/>
    <path d="M126 72 L104 73 L106 80 L124 79 Z" fill="#334155"/>
    <line x1="78" y1="74" x2="90" y2="75" stroke="#4ade80" stroke-width="2"/>
    <line x1="122" y1="74" x2="110" y2="75" stroke="#4ade80" stroke-width="2"/>

    <!-- Nose -->
    <path d="M98 86 L95 93 L102 93" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Stern Mouth -->
    <line x1="88" y1="102" x2="112" y2="102" stroke="#7c2d12" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Iconic Flat-Top Hair -->
    <!-- Flat Top Crown -->
    <path d="M50 48 L150 48 L138 66 L62 66 Z" fill="url(#flattop-gold)"/>
    <path d="M48 48 C 45 20, 155 20, 152 48 Z" fill="#eab308"/>
    <!-- Hair Strands & Texture -->
    <line x1="60" y1="28" x2="60" y2="48" stroke="#fef08a" stroke-width="3"/>
    <line x1="80" y1="22" x2="80" y2="48" stroke="#fef08a" stroke-width="3"/>
    <line x1="100" y1="20" x2="100" y2="48" stroke="#fef08a" stroke-width="3"/>
    <line x1="120" y1="22" x2="120" y2="48" stroke="#fef08a" stroke-width="3"/>
    <line x1="140" y1="28" x2="140" y2="48" stroke="#fef08a" stroke-width="3"/>
  </g>

  <!-- Arcade Banner -->
  <rect x="25" y="162" width="150" height="26" rx="13" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <text x="100" y="179" font-family="'Impact', 'Arial Black', sans-serif" font-size="11" fill="#86efac" text-anchor="middle" letter-spacing="1">GUILE • SONIC COMMANDO</text>
</svg>
