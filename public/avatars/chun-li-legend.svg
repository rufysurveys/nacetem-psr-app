<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" role="img" aria-label="Chun-Li Martial Legend Avatar">
  <defs>
    <linearGradient id="chunli-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="chunli-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chunli-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
    <linearGradient id="qipao-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="200" height="200" rx="40" fill="url(#chunli-bg)"/>
  
  <!-- Arcade Rays -->
  <g stroke="#7dd3fc" stroke-width="1.5" opacity="0.3">
    <line x1="100" y1="100" x2="0" y2="0"/>
    <line x1="100" y1="100" x2="200" y2="0"/>
    <line x1="100" y1="100" x2="200" y2="200"/>
    <line x1="100" y1="100" x2="0" y2="200"/>
    <circle cx="40" cy="40" r="3" fill="#ffffff"/>
    <circle cx="160" cy="40" r="4" fill="#fef08a"/>
    <circle cx="170" cy="140" r="3" fill="#ffffff"/>
  </g>
  <circle cx="100" cy="100" r="75" fill="url(#chunli-aura)"/>

  <!-- Character Group -->
  <g transform="translate(0, 5)">
    <!-- Ox-Horn Buns (Behind) -->
    <!-- Left Bun -->
    <circle cx="48" cy="48" r="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M30 50 Q20 30 10 25 Q25 45 32 58 Z" fill="#ffffff"/>
    <path d="M32 52 Q15 60 5 68 Q25 62 35 56 Z" fill="#f1f5f9"/>

    <!-- Right Bun -->
    <circle cx="152" cy="48" r="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M170 50 Q180 30 190 25 Q175 45 168 58 Z" fill="#ffffff"/>
    <path d="M168 52 Q185 60 195 68 Q175 62 165 56 Z" fill="#f1f5f9"/>

    <!-- Qipao Dress Body -->
    <path d="M38 195 C 42 138, 62 125, 100 125 C 138 125, 158 138, 162 195 Z" fill="url(#qipao-blue)"/>
    <!-- Gold Trim Embroidery -->
    <path d="M100 125 L100 195 M75 140 C 90 145, 110 145, 125 140" fill="none" stroke="#facc15" stroke-width="3.5"/>
    <circle cx="100" cy="145" r="4" fill="#facc15"/>
    <circle cx="100" cy="165" r="4" fill="#facc15"/>
    <!-- White High Collar -->
    <path d="M78 125 L100 142 L122 125" fill="none" stroke="#ffffff" stroke-width="5"/>

    <!-- Neck -->
    <path d="M84 105 L84 130 C 84 136, 116 136, 116 105 Z" fill="#fda4af"/>

    <!-- Face -->
    <path d="M70 65 C 70 45, 130 45, 130 65 C 130 102, 118 115, 100 115 C 82 115, 70 102, 70 65 Z" fill="url(#chunli-skin)"/>

    <!-- Hair Base & Bangs -->
    <path d="M68 62 C 68 40, 132 40, 132 62 C 122 45, 78 45, 68 62 Z" fill="#334155"/>
    <!-- Cute Bangs -->
    <path d="M72 56 Q85 66 100 60 Q115 66 128 56 Q115 48 100 50 Q85 48 72 56 Z" fill="#1e293b"/>

    <!-- Big Anime Eyes -->
    <ellipse cx="85" cy="74" rx="7" ry="9" fill="#ffffff"/>
    <ellipse cx="85" cy="74" rx="4.5" ry="6.5" fill="#0284c7"/>
    <circle cx="87" cy="71" r="2" fill="#ffffff"/>

    <ellipse cx="115" cy="74" rx="7" ry="9" fill="#ffffff"/>
    <ellipse cx="115" cy="74" rx="4.5" ry="6.5" fill="#0284c7"/>
    <circle cx="117" cy="71" r="2" fill="#ffffff"/>

    <!-- Eyelashes -->
    <path d="M76 67 Q85 64 94 68" stroke="#0f172a" stroke-width="2.5" fill="none"/>
    <path d="M106 68 Q115 64 124 67" stroke="#0f172a" stroke-width="2.5" fill="none"/>

    <!-- Cute Blush & Lips -->
    <ellipse cx="76" cy="85" rx="5" ry="2.5" fill="#f43f5e" opacity="0.4"/>
    <ellipse cx="124" cy="85" rx="5" ry="2.5" fill="#f43f5e" opacity="0.4"/>
    <path d="M94 94 Q100 99 106 94" fill="none" stroke="#e11d48" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Arcade Banner -->
  <rect x="25" y="162" width="150" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="100" y="179" font-family="'Impact', 'Arial Black', sans-serif" font-size="11" fill="#7dd3fc" text-anchor="middle" letter-spacing="1">CHUN-LI • KICK LEGEND</text>
</svg>
