<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" role="img" aria-label="Cammy Delta Operative Avatar">
  <defs>
    <linearGradient id="cammy-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be185d"/>
      <stop offset="50%" stop-color="#9d174d"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="cammy-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cammy-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="200" height="200" rx="40" fill="url(#cammy-bg)"/>
  
  <!-- Speed Lines -->
  <g stroke="#f472b6" stroke-width="1.5" opacity="0.3">
    <line x1="0" y1="30" x2="200" y2="70"/>
    <line x1="0" y1="70" x2="200" y2="110"/>
    <line x1="0" y1="110" x2="200" y2="150"/>
    <circle cx="160" cy="40" r="4" fill="#ffffff"/>
  </g>
  <circle cx="100" cy="100" r="75" fill="url(#cammy-aura)"/>

  <!-- Character Group -->
  <g transform="translate(0, 5)">
    <!-- Long Blonde Braids (Behind Shoulders) -->
    <!-- Left Braid -->
    <path d="M42 65 Q25 90 20 150 Q12 180 5 195" fill="none" stroke="#facc15" stroke-width="12" stroke-linecap="round"/>
    <path d="M42 65 Q25 90 20 150 Q12 180 5 195" fill="none" stroke="#eab308" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 6"/>

    <!-- Right Braid -->
    <path d="M158 65 Q175 90 180 150 Q188 180 195 195" fill="none" stroke="#facc15" stroke-width="12" stroke-linecap="round"/>
    <path d="M158 65 Q175 90 180 150 Q188 180 195 195" fill="none" stroke="#eab308" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 6"/>

    <!-- Green Tactical Suit -->
    <path d="M38 195 C 42 138, 62 125, 100 125 C 138 125, 158 138, 162 195 Z" fill="#15803d"/>
    <path d="M75 130 L100 160 L125 130" fill="none" stroke="#166534" stroke-width="5"/>
    <path d="M84 135 L100 170 L116 135" fill="url(#cammy-skin)"/>
    <!-- Red Delta Insignia Pin -->
    <polygon points="100,140 106,150 94,150" fill="#dc2626"/>

    <!-- Neck -->
    <path d="M84 105 L84 130 C 84 136, 116 136, 116 105 Z" fill="#fda4af"/>

    <!-- Face -->
    <path d="M70 65 C 70 45, 130 45, 130 65 C 130 102, 118 115, 100 115 C 82 115, 70 102, 70 65 Z" fill="url(#cammy-skin)"/>

    <!-- Cheek Camo Stripe Paint -->
    <line x1="72" y1="88" x2="84" y2="92" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
    <line x1="128" y1="88" x2="116" y2="92" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>

    <!-- Sharp Blue Eyes -->
    <ellipse cx="85" cy="74" rx="6.5" ry="8" fill="#ffffff"/>
    <ellipse cx="85" cy="74" rx="4" ry="6" fill="#0284c7"/>
    <circle cx="86" cy="72" r="1.8" fill="#ffffff"/>

    <ellipse cx="115" cy="74" rx="6.5" ry="8" fill="#ffffff"/>
    <ellipse cx="115" cy="74" rx="4" ry="6" fill="#0284c7"/>
    <circle cx="116" cy="72" r="1.8" fill="#ffffff"/>

    <!-- Eyebrows & Lashes -->
    <path d="M76 66 L94 68" stroke="#ca8a04" stroke-width="2.5" fill="none"/>
    <path d="M124 66 L106 68" stroke="#ca8a04" stroke-width="2.5" fill="none"/>

    <!-- Nose & Mouth -->
    <path d="M98 78 L95 87 L102 87" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
    <path d="M94 96 Q100 100 106 96" fill="none" stroke="#be185d" stroke-width="3" stroke-linecap="round"/>

    <!-- Red Beret -->
    <path d="M50 48 Q100 15 155 35 Q165 48 140 55 Q100 58 55 58 Z" fill="#dc2626"/>
    <path d="M55 52 Q100 58 145 52 L142 58 Q100 64 58 58 Z" fill="#991b1b"/>
    <!-- Yellow Beret Badge -->
    <circle cx="80" cy="46" r="5" fill="#facc15"/>
  </g>

  <!-- Arcade Banner -->
  <rect x="25" y="162" width="150" height="26" rx="13" fill="#0f172a" stroke="#f472b6" stroke-width="2"/>
  <text x="100" y="179" font-family="'Impact', 'Arial Black', sans-serif" font-size="11" fill="#fbcfe8" text-anchor="middle" letter-spacing="1">CAMMY • DELTA OPERATIVE</text>
</svg>
