<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" role="img" aria-label="Ryu Dragon Fighter Avatar">
  <defs>
    <linearGradient id="ryu-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="ryu-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ryu-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffdfc4"/>
      <stop offset="100%" stop-color="#d99b73"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="200" height="200" rx="40" fill="url(#ryu-bg)"/>
  
  <!-- Arcade Burst Rays -->
  <g stroke="#fca5a5" stroke-width="1.5" opacity="0.25">
    <line x1="100" y1="100" x2="0" y2="0"/>
    <line x1="100" y1="100" x2="200" y2="0"/>
    <line x1="100" y1="100" x2="200" y2="200"/>
    <line x1="100" y1="100" x2="0" y2="200"/>
    <line x1="100" y1="100" x2="100" y2="0"/>
    <line x1="100" y1="100" x2="200" y2="100"/>
    <line x1="100" y1="100" x2="100" y2="200"/>
    <line x1="100" y1="100" x2="0" y2="100"/>
  </g>
  <circle cx="100" cy="100" r="75" fill="url(#ryu-aura)"/>

  <!-- Character Group -->
  <g transform="translate(0, 5)">
    <!-- Gi Shoulders -->
    <path d="M35 195 C 40 140, 60 128, 100 128 C 140 128, 160 140, 165 195 Z" fill="#f8fafc"/>
    <path d="M70 135 L100 175 L130 135" fill="none" stroke="#cbd5e1" stroke-width="6"/>
    <path d="M82 145 L100 182 L118 145" fill="url(#ryu-skin)"/>
    <!-- Black Gi Lapel Trim -->
    <path d="M62 132 L85 195 M138 132 L115 195" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>

    <!-- Neck -->
    <path d="M82 108 L82 138 C 82 146, 118 146, 118 108 Z" fill="#c7855e"/>

    <!-- Head -->
    <path d="M68 68 C 68 45, 132 45, 132 68 C 132 105, 120 118, 100 118 C 80 118, 68 105, 68 68 Z" fill="url(#ryu-skin)"/>

    <!-- Ears -->
    <ellipse cx="66" cy="78" rx="6" ry="10" fill="#d99b73"/>
    <ellipse cx="134" cy="78" rx="6" ry="10" fill="#d99b73"/>

    <!-- Intense Eyes -->
    <path d="M74 68 L94 73 L94 65 Z" fill="#0f172a"/>
    <ellipse cx="85" cy="75" rx="5" ry="4" fill="#ffffff"/>
    <circle cx="86" cy="75" r="2.5" fill="#7f1d1d"/>

    <path d="M126 68 L106 73 L106 65 Z" fill="#0f172a"/>
    <ellipse cx="115" cy="75" rx="5" ry="4" fill="#ffffff"/>
    <circle cx="114" cy="75" r="2.5" fill="#7f1d1d"/>

    <!-- Nose -->
    <path d="M98 76 L95 87 L102 87" fill="none" stroke="#aa6842" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Mouth -->
    <path d="M88 98 Q100 94 112 98" fill="none" stroke="#7f1d1d" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Spiky Black Hair -->
    <path d="M64 64 C 55 40, 75 22, 90 18 C 95 10, 115 12, 125 22 C 142 32, 145 52, 136 64 Z" fill="#0f172a"/>
    <path d="M60 48 L48 35 L70 36 L78 20 L94 30 L108 14 L120 28 L136 24 L132 42 L146 48 L132 58 Z" fill="#1e293b"/>

    <!-- Red Headband -->
    <path d="M58 60 Q100 50 142 60 L144 72 Q100 60 56 72 Z" fill="#ef4444"/>
    <path d="M136 64 Q168 56 188 40 Q168 70 138 72 Z" fill="#ef4444"/>
    <path d="M136 68 Q172 72 192 68 Q164 86 135 75 Z" fill="#dc2626"/>
  </g>

  <!-- Arcade Banner -->
  <rect x="30" y="162" width="140" height="26" rx="13" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
  <text x="100" y="179" font-family="'Impact', 'Arial Black', sans-serif" font-size="12" fill="#fef08a" text-anchor="middle" letter-spacing="1">RYU • DRAGON FIST</text>
</svg>
