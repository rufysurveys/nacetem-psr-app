<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" role="img" aria-label="Ken Flame Master Avatar">
  <defs>
    <linearGradient id="ken-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <radialGradient id="ken-fire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ken-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="200" height="200" rx="40" fill="url(#ken-bg)"/>
  
  <!-- Flame Sparks -->
  <g fill="#fef08a">
    <circle cx="35" cy="45" r="3"/>
    <circle cx="165" cy="55" r="4"/>
    <circle cx="175" cy="135" r="2.5"/>
    <polygon points="40,140 43,148 37,148"/>
    <polygon points="160,30 164,40 157,40"/>
  </g>
  <circle cx="100" cy="100" r="75" fill="url(#ken-fire)"/>

  <!-- Character Group -->
  <g transform="translate(0, 5)">
    <!-- Red Gi Shoulders -->
    <path d="M35 195 C 40 140, 60 128, 100 128 C 140 128, 160 140, 165 195 Z" fill="#dc2626"/>
    <path d="M70 135 L100 175 L130 135" fill="none" stroke="#b91c1c" stroke-width="6"/>
    <path d="M82 145 L100 182 L118 145" fill="url(#ken-skin)"/>
    <!-- Black V-Neck Under shirt -->
    <path d="M85 152 L100 180 L115 152" fill="#1e293b"/>

    <!-- Neck -->
    <path d="M82 108 L82 138 C 82 146, 118 146, 118 108 Z" fill="#fb923c"/>

    <!-- Head -->
    <path d="M68 68 C 68 45, 132 45, 132 68 C 132 105, 120 118, 100 118 C 80 118, 68 105, 68 68 Z" fill="url(#ken-skin)"/>

    <!-- Ears -->
    <ellipse cx="66" cy="78" rx="6" ry="10" fill="#fdba74"/>
    <ellipse cx="134" cy="78" rx="6" ry="10" fill="#fdba74"/>

    <!-- Bright Blue Eyes & Cocky Brow -->
    <path d="M72 64 L94 70 L94 62 Z" fill="#451a03"/>
    <ellipse cx="85" cy="73" rx="5" ry="4" fill="#ffffff"/>
    <circle cx="86" cy="73" r="2.5" fill="#0284c7"/>

    <path d="M128 64 L106 70 L106 62 Z" fill="#451a03"/>
    <ellipse cx="115" cy="73" rx="5" ry="4" fill="#ffffff"/>
    <circle cx="114" cy="73" r="2.5" fill="#0284c7"/>

    <!-- Nose -->
    <path d="M98 76 L95 87 L102 87" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Cocky Smirk -->
    <path d="M86 96 Q102 104 116 92" fill="none" stroke="#991b1b" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Spiky Fiery Blonde Hair -->
    <path d="M60 68 C 50 35, 70 15, 95 12 C 105 8, 130 15, 140 32 C 152 48, 145 68, 138 72 C 130 50, 115 28, 95 30 C 80 32, 70 48, 60 68 Z" fill="#facc15"/>
    <!-- Wild Blonde Hair Spikes -->
    <path d="M52 50 L42 28 L66 32 L75 14 L92 26 L108 8 L122 22 L142 16 L138 38 L154 44 L136 60 Z" fill="#fde047"/>
    <path d="M65 40 L78 26 L90 34 L105 18 L118 30 Z" fill="#fef08a"/>
  </g>

  <!-- Arcade Banner -->
  <rect x="30" y="162" width="140" height="26" rx="13" fill="#0f172a" stroke="#f97316" stroke-width="2"/>
  <text x="100" y="179" font-family="'Impact', 'Arial Black', sans-serif" font-size="12" fill="#fef08a" text-anchor="middle" letter-spacing="1">KEN • FLAME MASTER</text>
</svg>
